[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailceo-bench"
version = "0.1.0"
description = "LLM CEO evaluation benchmark — tier-2 Indian retail chain simulation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
eval = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]
openenv = [
    "openenv>=0.4.1",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["retailceo*", "eval*", "retailceo_env*"]
